name: Publicar Zerão na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerao-hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar projetozerao
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar arquivos sem cache antigo
        run: |
          cp styles.css styles.20261029-3.css
          cp sync.js sync.20261029-3.js
          cp app.js app.20261029-3.js
          cp portal.js portal.20261029-3.js

      - name: Enviar arquivos para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .gitignore
            README.md
            zerao-3d-hostinger.zip
