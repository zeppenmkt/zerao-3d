name: Publicar Zerão na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerao-hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar projetozerao
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar arquivos sem cache antigo
        run: |
          VERSION="${GITHUB_SHA::8}"
          for asset in styles.css sync.js app.js portal.js; do
            cp "$asset" "${asset%.*}.$VERSION.${asset##*.}"
          done
          sed -i "s/const ZERAO_ASSET_VERSION = \"\";/const ZERAO_ASSET_VERSION = \"$VERSION\";/" "sync.$VERSION.js"
          sed -i -e "s/href=\"styles.css\"/href=\"styles.$VERSION.css\"/" -e "s/src=\"sync.js\"/src=\"sync.$VERSION.js\"/" index.html
          grep -q "ZERAO_ASSET_VERSION = \"$VERSION\"" "sync.$VERSION.js"
          grep -q "styles.$VERSION.css" index.html
          grep -q "sync.$VERSION.js" index.html

      - name: Enviar arquivos para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .gitignore
            README.md
            zerao-3d-hostinger.zip
